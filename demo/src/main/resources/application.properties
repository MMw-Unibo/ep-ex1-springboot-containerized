spring.application.name=demo
# Connection comes from the environment, so the same image runs on the laptop, in Compose, and in DM2
spring.data.mongodb.uri=mongodb://${MONGO_USER:mongoadmin}:${MONGO_PSWD:secret}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/?authSource=admin
spring.data.mongodb.database=${MONGO_DB:demo}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
